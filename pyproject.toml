[project]
name = "preppipe"
version = "0.1.0"
description = "Data cleaning, EDA and correlation analysis that exports a leakage-safe scikit-learn preprocessing pipeline."
readme = "README.md"
authors = [
    { name = "jcasp09", email = "jasoncasper2003@icloud.com" }
]
requires-python = ">=3.11"
# Core library only: no Streamlit / FastAPI here (see CLAUDE.md).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",   # needed for set_output(transform="pandas") everywhere
    "pyarrow>=15",         # Parquet read/write
    "joblib>=1.3",         # pipeline export
]

[project.optional-dependencies]
app = [
    "streamlit>=1.38",
    "plotly>=5.22",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # file uploads in FastAPI
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
